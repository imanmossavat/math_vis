[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "math_vis"
version = "0.1.0"
description = "Generative-art toolkit for math-driven visuals"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "matplotlib",
    "scipy",
    "pillow",
]

[tool.setuptools]
packages = ["math_vis"]
